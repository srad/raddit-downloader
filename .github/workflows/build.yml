name: Build/Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # OPTIONAL: If you have native modules (sqlite3, etc),
      # you might need to install python/compiler tools here.

      - name: Install Dependencies
        run: npm ci

      # THIS STEP IS CRITICAL: compiles your code to 'dist'
      - name: Build Source
        run: npm run build

      - name: Make (Package)
        # Using npx ensures we use the local electron-forge version
        run: npx electron-forge make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: out/make/**/*